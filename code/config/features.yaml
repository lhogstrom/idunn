# Feature Definitions for Actionability Prediction
#
# Changes to feature definitions should ONLY be made in this file.
# All Python modules import from this configuration via feature_config.py

metadata:
  version: "2.0"
  description: "Feature definitions for OncoKB actionability prediction models (reduced technical features)"
  notes: |
    - Use 'demographic' feature set for biological insights
    - Use 'both' for maximum predictive power (with caveats about interpretability)

# Feature Sets - grouped by category
feature_sets:
  demographic:
    description: "Patient and sample characteristics (no data leakage)"
    features:
      - SAMPLE_TYPE
      - SAMPLE_TYPE_DETAILED
      - SEX
      - RACE
      - ETHNICITY
      - AGE_AT_SEQ_REPORT

  technical:
    description: "Sequencing and institutional features (may cause data leakage)"
    features:
      - SUBJECT_CENTER
      - number_of_genes
      - preservation_technique
      - calling_strategy

# Feature Types - for preprocessing pipeline
feature_types:
  numeric:
    description: "Features processed with median imputation"
    features:
      - AGE_AT_SEQ_REPORT
      - number_of_genes

  categorical:
    description: "Features processed with most frequent imputation + one-hot encoding"
    features:
      # Demographic categorical features
      - SAMPLE_TYPE
      - SAMPLE_TYPE_DETAILED
      - SEX
      - RACE
      - ETHNICITY
      # Technical categorical features
      - SUBJECT_CENTER
      - preservation_technique
      - calling_strategy

# Display Names - for SHAP visualizations and reports
display_names:
  # Demographic features
  AGE_AT_SEQ_REPORT: "Age at Sequencing"
  SEX: "Sex"
  RACE: "Race"
  ETHNICITY: "Ethnicity"
  SAMPLE_TYPE: "Sample Type"
  SAMPLE_TYPE_DETAILED: "Sample Type (Detailed)"

  # Technical features
  SUBJECT_CENTER: "Subject Center"
  number_of_genes: "Number of Genes"
  preservation_technique: "Preservation Technique"
  calling_strategy: "Variant Calling Strategy"

# Value Display Names - for categorical value labels
value_display_names:
  # Sex values
  Male: "Male"
  Female: "Female"

  # Race values
  White: "White"
  Black: "Black or African American"
  Asian: "Asian"
  American Indian or Alaska Native: "Native American"
  Native Hawaiian or Other Pacific Islander: "Pacific Islander"
  Other: "Other"
  Unknown: "Unknown"

  # Ethnicity values
  Not Hispanic or Latino: "Non-Hispanic"
  Hispanic or Latino: "Hispanic"

  # Sample type values
  Metastatic: "Metastatic"
  Primary: "Primary"
  Local recurrence: "Local Recurrence"
