[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Integration scripts are database-dependent and should be run manually.

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring database connection

addopts = -v --tb=short --ignore=tests/integration_data_loader_multicancer.py --ignore=tests/integration_multi_tier_loading.py

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
