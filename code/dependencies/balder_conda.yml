name: balder_conda_env
channels:
  - conda-forge
  - defaults
  - bioconda
dependencies:
  - python=3.9.18
  - pandas=2.1.3
  - numpy=1.26.0
  - matplotlib=3.8.1
  - seaborn=0.12.2
  - scikit-learn=1.3.2
  - xgboost
  - pyyaml
  - pytest
  - sqlalchemy
  - rpy2=3.5.11
  - ipykernel
  - pip
  - pip:
      - adjustText==0.8
      # oncokb annotator requirements
      - kiwisolver==1.2.0
      - requests==2.31.0
      - urllib3==1.26.8
  - nextflow
  - libgfortran5
  - r-base=4.3.2
  - r-devtools
  - r-dplyr
  - r-tidyr
  - r-DBI
  - r-ggplot2
  - r-ggalluvial
  - r-ggrepel
  - r-rpart
  - r-rpart.plot
  - r-corrplot
  - r-reshape2
  - r-caret
  - r-circlize
